app:
  host: 127.0.0.1
  port: 8765
database:
  sqlite_path: data/boss_agent.db
codex:
  request_timeout_seconds: 30
  image_execution_channel: exec
agent:
  organize_timeout_seconds: 120
conversation:
  unknown_context_window: 128000
  default_max_output_tokens: 9000
  reserve_ratio: 0.3
  reserve_tokens_floor: 4096
  reserve_tokens_ceiling: 32768
  auto_compaction_enabled: true
  compaction_trigger_ratio: 0.75
  keep_recent_tokens: 50000
  summary_max_tokens: 8000
retry:
  request_timeout_seconds: 300
  attempts_per_model: 3
  retry_delay_minutes: 1
memory:
  enabled: false
  vector_dimensions: 256
  top_k: 5
  minimum_score: 0.18
  daily_hour: 3
  soft_delete_days: 30
process_watchdog:
  enabled: true
  check_interval_seconds: 60
  warning_mb: 1024
  restart_mb: 1536
  consecutive_breaches: 3
  max_uptime_hours: 24
agent_runtime:
  heartbeat_enabled: false
  heartbeat_interval_minutes: 30
  queue_scan_seconds: 2
  discussion_max_rounds: 6
  discussion_max_minutes: 60
work_runtime:
  lease_seconds: 120
  max_steps_per_run: 12
  max_tool_calls_per_thread: 80
  decision_tool_repair_attempts: 2
  auto_execute_enabled: false
  queue_scan_seconds: 2
  max_concurrent_agents: 4
work_context:
  enabled: true
  max_prompt_chars: 16000
  checkpoint_max_chars: 8000
  recent_tool_calls: 2
  recent_result_chars: 1200
  summary_interval_tool_calls: 5
  evidence_limit: 20
  failure_limit: 20
work_budget:
  max_model_tokens_per_tree: 500000
  max_active_minutes_per_tree: 240
work_governance:
  enabled: false
  scan_interval_seconds: 60
  duplicate_similarity_threshold: 0.82
  stalled_minutes: 30
  quality_review_enabled: true
workspace:
  max_file_bytes: 20000000
  max_text_chars: 30000
  max_results: 100
  max_pdf_pages_per_call: 20
  max_pdf_search_pages: 200
  max_table_scan_rows: 20000
  max_table_rows_per_call: 200
  max_table_columns: 100
  max_table_groups: 200
  max_table_cell_chars: 2000
  max_workbook_sheets: 50
  max_xlsx_uncompressed_bytes: 100000000
browser:
  navigation_timeout_ms: 30000
  max_page_chars: 30000
  max_elements: 120
  max_response_bytes: 5000000
  max_sessions: 4
  idle_timeout_seconds: 600
research:
  search_duckduckgo_endpoint: ''
  search_brave_endpoint: https://search.brave.com/search?source=web&q={query}&offset={offset}
  search_endpoint: https://www.bing.com/search?format=rss&q={query}&first={first}
  search_html_endpoint: https://www.bing.com/search?setlang=en-US&cc=US&q={query}&first={first}
  timeout_seconds: 20
  request_attempts: 3
  max_response_bytes: 1000000
  max_page_chars: 30000
  max_feed_bytes: 2000000
  max_directory_pages: 12
